name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test and coverage
        run: mvn verify

      - name: Generate JaCoCo summary
        if: always()
        run: |
          python3 <<'PY'
          import os
          from textwrap import dedent
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("target/site/jacoco/jacoco.xml")

          if not report.exists():
              body = dedent("""\
              ## JaCoCo Coverage

              JaCoCo report was not generated.
              """)
          else:
              root = ET.parse(report).getroot()

              def coverage(counter_type):
                  counter = root.find(f"./counter[@type='{counter_type}']")
                  missed = int(counter.attrib["missed"])
                  covered = int(counter.attrib["covered"])
                  total = missed + covered
                  percent = 0 if total == 0 else covered * 100 / total
                  return missed, covered, percent

              instruction_missed, instruction_covered, instruction_percent = coverage("INSTRUCTION")
              branch_missed, branch_covered, branch_percent = coverage("BRANCH")
              line_missed, line_covered, line_percent = coverage("LINE")

              body = dedent(f"""\
              ## JaCoCo Coverage

              | Metric | Coverage | Covered | Missed |
              | --- | ---: | ---: | ---: |
              | Instruction | {instruction_percent:.1f}% | {instruction_covered} | {instruction_missed} |
              | Branch | {branch_percent:.1f}% | {branch_covered} | {branch_missed} |
              | Line | {line_percent:.1f}% | {line_covered} | {line_missed} |

              Full HTML report is available in the `jacoco-report` workflow artifact.
              """)

          Path("coverage-summary.md").write_text(body, encoding="utf-8")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(body)
          PY

      - name: Comment JaCoCo summary on PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- life-service-coverage -->';
            const summary = fs.readFileSync('coverage-summary.md', 'utf8');
            const body = `${marker}\n${summary}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          docker compose -f compose.yaml config
          docker compose --env-file deploy/.env.prod.example -f deploy/docker-compose.prod.yml config

      - name: Build backend image
        run: docker build -t life-service-backend:test .

      - name: Build frontend image
        run: docker build -t life-service-frontend:test ./frontend
