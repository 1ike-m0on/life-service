apiVersion: v1
kind: ConfigMap
metadata:
  name: life-service-config
  labels:
    app.kubernetes.io/name: life-service
    app.kubernetes.io/part-of: life-service
data:
  TZ: Asia/Shanghai
  SERVER_PORT: "8081"
  SPRING_PROFILES_ACTIVE: demo

  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: life_service
  MYSQL_USERNAME: root
  MYSQL_POOL_MAX_SIZE: "8"
  MYSQL_POOL_MIN_IDLE: "2"
  MYSQL_POOL_CONNECTION_TIMEOUT_MS: "5000"

  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
  REDIS_DATABASE: "0"
  REDIS_POOL_MAX_ACTIVE: "32"
  REDIS_POOL_MAX_IDLE: "8"
  REDIS_POOL_MIN_IDLE: "2"

  ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
  ORDER_MESSAGE_PROVIDER: rocketmq

  ORDER_CLOSE_ENABLED: "true"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_IP_ENABLED: "true"
  RATE_LIMIT_GLOBAL_LIMIT_OVERRIDE: "0"
  FLASH_SALE_STARTUP_WARMUP_ENABLED: "true"
  FLASH_SALE_STARTUP_WARMUP_FAIL_FAST: "false"
  FLASH_SALE_STARTUP_WARMUP_MAX_VOUCHERS: "200"
