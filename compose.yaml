name: life-service

services:
  mysql:
    image: mysql:8.0
    container_name: life-service-mysql
    restart: unless-stopped
    mem_limit: ${MYSQL_MEM_LIMIT:-768m}
    memswap_limit: ${MYSQL_MEMSWAP_LIMIT:-768m}
    cpus: ${MYSQL_CPUS:-1.0}
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-life_service}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-128M}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-80}
      - --performance-schema=${MYSQL_PERFORMANCE_SCHEMA:-OFF}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      life-service-net:

  redis:
    image: redis:7.2
    container_name: life-service-redis
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    memswap_limit: ${REDIS_MEMSWAP_LIMIT:-256m}
    cpus: ${REDIS_CPUS:-0.5}
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-128mb}
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      life-service-net:

  rocketmq-namesrv:
    image: apache/rocketmq:${ROCKETMQ_VERSION:-5.5.0}
    container_name: life-service-rocketmq-namesrv
    restart: unless-stopped
    mem_limit: ${ROCKETMQ_NAMESRV_MEM_LIMIT:-384m}
    memswap_limit: ${ROCKETMQ_NAMESRV_MEMSWAP_LIMIT:-384m}
    cpus: ${ROCKETMQ_NAMESRV_CPUS:-0.5}
    environment:
      TZ: Asia/Shanghai
      JAVA_OPT_EXT: "${ROCKETMQ_NAMESRV_JAVA_OPT_EXT:--server -Xms192m -Xmx192m -Xmn96m}"
    ports:
      - "${ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    command: sh mqnamesrv
    volumes:
      - rocketmq_namesrv_logs:/home/rocketmq/logs
    networks:
      life-service-net:
        ipv4_address: 172.28.0.11

  rocketmq-broker:
    image: apache/rocketmq:${ROCKETMQ_VERSION:-5.5.0}
    container_name: life-service-rocketmq-broker
    restart: unless-stopped
    mem_limit: ${ROCKETMQ_BROKER_MEM_LIMIT:-1024m}
    memswap_limit: ${ROCKETMQ_BROKER_MEMSWAP_LIMIT:-1024m}
    cpus: ${ROCKETMQ_BROKER_CPUS:-1.0}
    user: root
    depends_on:
      - rocketmq-namesrv
    environment:
      TZ: Asia/Shanghai
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "${ROCKETMQ_BROKER_JAVA_OPT_EXT:--server -Xms512m -Xmx512m -Xmn256m}"
    ports:
      - "${ROCKETMQ_BROKER_FAST_PORT:-10909}:10909"
      - "${ROCKETMQ_BROKER_PORT:-10911}:10911"
      - "${ROCKETMQ_BROKER_HA_PORT:-10912}:10912"
    command: |
      sh -c "cat > /home/rocketmq/broker.conf <<EOF
      brokerClusterName=DefaultCluster
      brokerName=broker-a
      brokerId=0
      brokerIP1=172.28.0.12
      namesrvAddr=rocketmq-namesrv:9876
      deleteWhen=04
      fileReservedTime=48
      brokerRole=ASYNC_MASTER
      flushDiskType=ASYNC_FLUSH
      autoCreateTopicEnable=true
      autoCreateSubscriptionGroup=true
      listenPort=10911
      storePathRootDir=/home/rocketmq/store
      storePathCommitLog=/home/rocketmq/store/commitlog
      EOF
      sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/broker.conf"
    volumes:
      - rocketmq_broker_logs:/home/rocketmq/logs
      - rocketmq_broker_store:/home/rocketmq/store
    networks:
      life-service-net:
        ipv4_address: 172.28.0.12

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: life-service-backend:local
    container_name: life-service-backend
    restart: unless-stopped
    mem_limit: ${BACKEND_MEM_LIMIT:-768m}
    memswap_limit: ${BACKEND_MEMSWAP_LIMIT:-768m}
    cpus: ${BACKEND_CPUS:-1.0}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      SERVER_PORT: 8081
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-life_service}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_POOL_MAX_SIZE: ${MYSQL_POOL_MAX_SIZE:-16}
      MYSQL_POOL_MIN_IDLE: ${MYSQL_POOL_MIN_IDLE:-4}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_POOL_MAX_ACTIVE: ${REDIS_POOL_MAX_ACTIVE:-64}
      REDIS_POOL_MAX_IDLE: ${REDIS_POOL_MAX_IDLE:-16}
      REDIS_POOL_MIN_IDLE: ${REDIS_POOL_MIN_IDLE:-4}
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      ORDER_MESSAGE_PROVIDER: rocketmq
      FLASH_SALE_STARTUP_WARMUP_ENABLED: ${FLASH_SALE_STARTUP_WARMUP_ENABLED:-true}
      FLASH_SALE_STARTUP_WARMUP_FAIL_FAST: ${FLASH_SALE_STARTUP_WARMUP_FAIL_FAST:-false}
      FLASH_SALE_STARTUP_WARMUP_MAX_VOUCHERS: ${FLASH_SALE_STARTUP_WARMUP_MAX_VOUCHERS:-200}
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep -q 'UP'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      life-service-net:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: life-service-frontend:local
    container_name: life-service-frontend
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEM_LIMIT:-128m}
    memswap_limit: ${FRONTEND_MEMSWAP_LIMIT:-128m}
    cpus: ${FRONTEND_CPUS:-0.25}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      life-service-net:

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: life-service-rocketmq-dashboard
    profiles:
      - dashboard
    restart: unless-stopped
    mem_limit: ${ROCKETMQ_DASHBOARD_MEM_LIMIT:-512m}
    memswap_limit: ${ROCKETMQ_DASHBOARD_MEMSWAP_LIMIT:-512m}
    cpus: ${ROCKETMQ_DASHBOARD_CPUS:-0.5}
    depends_on:
      - rocketmq-namesrv
      - rocketmq-broker
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "${ROCKETMQ_DASHBOARD_JAVA_OPTS:--Xms256m -Xmx256m -Drocketmq.namesrv.addr=rocketmq-namesrv:9876}"
    ports:
      - "${ROCKETMQ_DASHBOARD_PORT:-18082}:8082"
    networks:
      life-service-net:

networks:
  life-service-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  mysql_data:
  redis_data:
  rocketmq_namesrv_logs:
  rocketmq_broker_logs:
  rocketmq_broker_store:
