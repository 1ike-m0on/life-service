<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>秒杀接口测试</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f6f7fb;
      color: #1f2937;
    }

    main {
      width: min(720px, calc(100% - 32px));
      margin: 48px auto;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 24px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 15px;
    }

    button {
      margin-top: 18px;
      border: 0;
      border-radius: 6px;
      padding: 10px 16px;
      background: #2563eb;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    pre {
      min-height: 120px;
      margin-top: 20px;
      padding: 14px;
      border-radius: 6px;
      background: #0f172a;
      color: #e2e8f0;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
<main>
  <h1>秒杀接口测试</h1>

  <label for="voucherId">优惠券 ID</label>
  <input id="voucherId" value="1001">

  <label for="userId">用户 ID</label>
  <input id="userId" value="2001">

  <button id="submitButton" type="button">提交秒杀请求</button>

  <pre id="result">等待请求...</pre>
</main>

<script>
  const button = document.querySelector("#submitButton");
  const result = document.querySelector("#result");

  button.addEventListener("click", async () => {
    const voucherId = document.querySelector("#voucherId").value.trim();
    const userId = document.querySelector("#userId").value.trim();

    if (!voucherId || !userId) {
      result.textContent = "请填写优惠券 ID 和用户 ID。";
      return;
    }

    button.disabled = true;
    result.textContent = "请求中...";

    try {
      const response = await fetch(`/api/v1/flash-sale-vouchers/${voucherId}/orders`, {
        method: "POST",
        headers: {
          "X-User-Id": userId
        }
      });
      const text = await response.text();
      try {
        result.textContent = JSON.stringify(JSON.parse(text), null, 2);
      } catch (error) {
        result.textContent = text;
      }
    } catch (error) {
      result.textContent = error.message;
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
